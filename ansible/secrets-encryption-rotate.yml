---
# Stage 3, step "rotate-keys": `k3s secrets-encrypt rotate-keys` on the first
# server. Generates the secretbox key, activates encryption for new writes and
# rewrites every existing Secret, then waits for reencrypt_finished. No server
# is restarted here. See docs/secrets-encryption.md.
#
#   ansible-playbook secrets-encryption-rotate.yml --limit k3s01 \
#     -e secrets_encryption_environment=live \
#     -e secrets_encryption_confirm=rotate-keys:k3s01:$(date -u +%Y%m%dT%H%M%SZ)
#
# Every invocation needs a new confirmation naming the current UTC time; each
# one is accepted once, so repeating a command never rotates again. The
# approved procedure performs one rotation; another is refused unless
# secrets_encryption_additional_rotation_reason is recorded and
# secrets_encryption_additional_rotation_approval=additional-rotation:<time>
# names this confirmation's time.
- name: Rotate secrets-encryption keys and re-encrypt every Secret
  hosts: servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0

  vars:
    secrets_encryption_phase: rotate-keys
    secrets_encryption_target: first

  pre_tasks:
    # Runs on the controller, before facts, privilege escalation or any other task.
    - name: Guard the phase
      ansible.builtin.import_role:
        name: secrets-encryption
        tasks_from: guard.yml
      become: false

    - name: Gather minimal facts after the guard
      ansible.builtin.setup:
        gather_subset:
          - min

  tasks:
    - name: Gate on health, preservation and a snapshot newer than the last change
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: gate.yml
      vars:
        secrets_encryption_snapshot_after_change: true

    - name: Rotate
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: rotate.yml
