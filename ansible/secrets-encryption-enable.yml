---
# Stage 3, step "enable": `k3s secrets-encrypt enable` on the first server. It
# writes an identity-only encryption configuration; nothing is encrypted yet
# and no Secret is rewritten. See docs/secrets-encryption.md.
#
#   ansible-playbook secrets-encryption-enable.yml --limit k3s01 \
#     -e secrets_encryption_environment=live \
#     -e secrets_encryption_confirm=enable:k3s01:$(date -u +%Y%m%dT%H%M%SZ)
#
# No server is restarted here. Next: secrets-encryption-restart.yml for each
# server, k3s01 first.
- name: Enable secrets encryption with an identity configuration
  hosts: servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0

  vars:
    secrets_encryption_phase: enable
    secrets_encryption_target: first

  pre_tasks:
    # Runs on the controller, before facts, privilege escalation or any other task.
    - name: Guard the phase
      ansible.builtin.import_role:
        name: secrets-encryption
        tasks_from: guard.yml
      become: false

    - name: Gather minimal facts after the guard
      ansible.builtin.setup:
        gather_subset:
          - min

  tasks:
    - name: Gate on health, preservation and a fresh snapshot
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: gate.yml

    - name: Enable
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: enable.yml
