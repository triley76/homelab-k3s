---
# Stage 3, step "restart": restart one server after a recorded change, with the
# secrets-encryption drop-in in place. Run once per server, k3s01 first; a peer
# is refused until k3s01 has restarted since the last change. Refused while any
# server is re-encrypting. See docs/secrets-encryption.md.
#
#   ansible-playbook secrets-encryption-restart.yml --limit k3s01 \
#     -e secrets_encryption_environment=live \
#     -e secrets_encryption_confirm=restart:k3s01:$(date -u +%Y%m%dT%H%M%SZ)
#
# Fixed order: k3s01, k3s02, k3s03. Each server waits until the previous one
# has passed its post-restart gate.
#
# The only task in this automation that restarts K3s. No handler restarts it.
# A server that already runs with the current configuration is not restarted.
- name: Restart one K3s server for the secrets-encryption procedure
  hosts: servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0

  vars:
    secrets_encryption_phase: restart
    secrets_encryption_target: single

  pre_tasks:
    # Runs on the controller, before facts, privilege escalation or any other task.
    - name: Guard the phase
      ansible.builtin.import_role:
        name: secrets-encryption
        tasks_from: guard.yml
      become: false

    - name: Gather minimal facts after the guard
      ansible.builtin.setup:
        gather_subset:
          - min

  tasks:
    - name: Gate on health, preservation and a fresh snapshot
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: gate.yml

    - name: Restart
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: restart.yml
