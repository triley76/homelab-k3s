---
# Serial so that an accidental re-run against an existing cluster never changes
# time synchronization on every etcd member at once. Existing clusters use
# configure-time-sync.yml with --limit instead.
- name: Configure time synchronization before k3s installation
  hosts: servers
  serial: 1
  any_errors_fatal: true
  become: true
  vars:
    # Honored only while K3s is absent; see roles/time-sync/defaults/main.yml.
    time_sync_allow_startup_step: true
  roles:
    - time-sync

- name: Prepare all k3s cluster nodes
  hosts: servers
  become: true
  roles:
    - k3s-common

# Pinned age for Phase 7 recovery operations, on the first server only. It is
# independent of K3s and changes no service. Existing clusters use
# configure-recovery-tools.yml --limit k3s01 instead.
- name: Install the pinned age recovery tools on the first server
  hosts: servers[0]
  become: true
  roles:
    - recovery-tools

- name: Initialize first k3s server
  hosts: servers[0]
  any_errors_fatal: true
  become: true
  vars:
    k3s_mode: init
  roles:
    - k3s-server

- name: Deploy kube-vip control plane VIP
  hosts: servers[0]
  become: true
  roles:
    - kube-vip

- name: Join additional k3s servers
  hosts: servers[1:]
  serial: 1
  any_errors_fatal: true
  become: true
  vars:
    k3s_mode: join
  roles:
    - k3s-server

# After K3s is installed, re-run time-sync in no-startup-step mode so that no
# built node keeps the packaged startup step. The role installs and verifies
# the -R drop-in and restarts chronyd only if the running process lacks -R.
# K3s is not stopped or restarted.
- name: Persist no-startup-step time synchronization on all k3s servers
  hosts: servers
  serial: 1
  any_errors_fatal: true
  become: true
  vars:
    time_sync_allow_startup_step: false
  roles:
    - time-sync
