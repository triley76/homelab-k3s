---
# Stage 3 canary lifecycle on the first server. See docs/secrets-encryption.md.
#
#   ansible-playbook secrets-encryption-canary.yml --limit k3s01 \
#     -e secrets_encryption_environment=live \
#     -e secrets_encryption_canary_action=create-control \
#     -e secrets_encryption_confirm=canary-create-control:k3s01:$(date -u +%Y%m%dT%H%M%SZ)
#
# Actions: create-control (before rotate-keys), verify (after rotate-keys and
# the restarts; always cleans up), cleanup (repeatable). Raw etcd checks run
# only with -e secrets_encryption_raw_verification=true in a rehearsal
# environment. No existing Secret is read, and no canary value is displayed.
- name: Run the Stage 3 encryption canary
  hosts: servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0

  vars:
    secrets_encryption_phase: canary-{{ secrets_encryption_canary_action | default('unset') }}
    secrets_encryption_target: first

  pre_tasks:
    # Runs on the controller, before facts, privilege escalation or any other task.
    - name: Guard the phase
      ansible.builtin.import_role:
        name: secrets-encryption
        tasks_from: guard.yml
      become: false

    - name: Gather minimal facts after the guard
      ansible.builtin.setup:
        gather_subset:
          - min

  tasks:
    - name: Gate on health, preservation and a fresh snapshot
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: gate.yml

    - name: Run the canary action
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: canary.yml
