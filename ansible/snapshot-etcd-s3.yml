---
# Stage 4: a node-specific on-demand snapshot, uploaded with the drop-in's key.
# See docs/etcd-s3-uploads.md.
#
#   ansible-playbook snapshot-etcd-s3.yml --limit k3s01 \
#     -e etcd_s3_environment=live \
#     -e etcd_s3_confirm=snapshot:k3s01:$(date -u +%Y%m%dT%H%M%SZ)
#
# The name is always on-demand-s4-<host>; no other name can be passed.
- name: Take a Stage 4 on-demand etcd snapshot
  hosts: servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0

  vars:
    etcd_s3_phase: snapshot

  pre_tasks:
    # Runs on the controller, before facts, privilege escalation or any other task.
    - name: Guard the phase
      ansible.builtin.import_role:
        name: etcd-s3
        tasks_from: guard.yml
      become: false

    - name: Require the Stage 3 enabled state
      ansible.builtin.import_role:
        name: etcd-s3
        tasks_from: stage3.yml
      become: false

  tasks:
    - name: Check the preconditions
      ansible.builtin.include_role:
        name: etcd-s3
        tasks_from: preflight.yml
      vars:
        etcd_s3_preflight_required: true

    - name: Compute the settings
      ansible.builtin.include_role:
        name: etcd-s3
        tasks_from: values.yml

    - name: Verify the configuration before the save
      ansible.builtin.include_role:
        name: etcd-s3
        tasks_from: config_check.yml
      vars:
        etcd_s3_config_expected: present

    - name: Consume the confirmation
      ansible.builtin.include_role:
        name: etcd-s3
        tasks_from: ledger.yml

    - name: Upload an on-demand snapshot
      ansible.builtin.include_role:
        name: etcd-s3
        tasks_from: ondemand.yml

    - name: Check for credential leaks
      ansible.builtin.include_role:
        name: etcd-s3
        tasks_from: leaks.yml

    - name: Show the result
      ansible.builtin.debug:
        msg:
          server: "{{ inventory_hostname }}"
          on_demand_upload: ready
          leak_counts: 0
