---
# Rollback, step 1 of the K3s "Disable/Re-enable" HA procedure:
# `k3s secrets-encrypt disable` on S1. K3s puts the identity provider first, so
# new writes are stored in plaintext; existing Secrets stay encrypted (and
# readable, because the key stays configured) until
# secrets-encryption-reencrypt.yml rewrites them after every server has
# restarted. The documented procedure keeps the server arguments unchanged.
#
# Not yet rehearsal-approved: guard.yml refuses this phase in a live environment
# until secrets_encryption_rehearsal_approved_paths lists it. The disable and the
# plaintext re-encryption are separate phases with separate confirmations.
- name: Decide whether disable is required
  vars:
    se_encryptions: "{{ groups['servers'] | map('extract', secrets_encryption_servers) | map(attribute='status') | map(attribute='encryption') | unique | list }}"
  ansible.builtin.set_fact:
    secrets_encryption_disable_decision: >-
      {{ 'run' if (secrets_encryption_marker.phase == 'rotate-keys' and se_encryptions == ['enabled'])
      else 'done' if (secrets_encryption_marker.phase == 'disable'
                      and secrets_encryption_servers[groups['servers'][0]].status.encryption == 'disabled')
      else 'refuse' }}

- name: Enforce the disable preconditions
  vars:
    se_all: "{{ groups['servers'] | map('extract', secrets_encryption_servers) | list }}"
  ansible.builtin.assert:
    that:
      - secrets_encryption_disable_decision in ['run', 'done']
      - >-
        secrets_encryption_disable_decision == 'done'
        or (se_all | selectattr('checkpoint_reached', 'equalto', false) | list | length == 0
            and se_all | map(attribute='status') | selectattr('hashes_match', 'equalto', false) | list | length == 0)
    fail_msg: >-
      Disable is allowed only after a completed rotation, with every server Enabled, restarted
      since the rotation and reporting matching hashes. State: {{ secrets_encryption_report.encryption }};
      last change {{ secrets_encryption_marker.phase }}.
    quiet: true

- name: Disable secrets encryption
  when: secrets_encryption_disable_decision == 'run'
  block:
    - name: Run secrets-encrypt disable on the first server
      ansible.builtin.command:
        argv: ["{{ secrets_encryption_k3s_bin }}", secrets-encrypt, disable]
      register: secrets_encryption_disable_result
      changed_when: true

    - name: Require the documented disable result
      ansible.builtin.assert:
        that:
          - secrets_encryption_disable_result.rc == 0
          - secrets_encryption_disable_result.stdout | trim == 'secrets-encryption disabled'
        fail_msg: "secrets-encrypt disable did not report success. Stop; do not restart any server."
        quiet: true

    - name: Read the time after disable
      ansible.builtin.command:
        argv: [date, +%s]
      register: secrets_encryption_change_time
      changed_when: false

    - name: Record the disable change
      ansible.builtin.copy:
        dest: "{{ secrets_encryption_state_dir }}/last-change"
        content: "{{ secrets_encryption_change_time.stdout | trim }} disable\n"
        owner: root
        group: root
        mode: '0600'
        follow: false

- name: Show the next step after disable
  ansible.builtin.debug:
    msg: >-
      Restart each server with the drop-in unchanged, k3s01 first (secrets-encryption-restart.yml),
      then run secrets-encryption-reencrypt.yml.
