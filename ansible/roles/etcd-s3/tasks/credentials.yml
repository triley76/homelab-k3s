---
# D3: the access key and the bucket name enter Ansible only from the operator's
# files, named by two environment variables (never extra vars). Everything runs
# on the controller, before privilege escalation. Every task that reads,
# validates or holds a credential has no_log, diff off and no backup, so
# neither a success nor a failure displays a value; a refusal is identified by
# its task name alone.

- name: Resolve the credential source paths from the environment
  ansible.builtin.set_fact:
    etcd_s3_sources:
      key: "{{ lookup('ansible.builtin.env', etcd_s3_key_file_env) }}"
      bucket: "{{ lookup('ansible.builtin.env', etcd_s3_bucket_file_env) }}"
  run_once: true
  delegate_to: localhost
  become: false
  no_log: true
  diff: false

- name: Require absolute credential source paths
  ansible.builtin.assert:
    that:
      - etcd_s3_sources.key is match('^/[^\s]*[^/\s]$')
      - etcd_s3_sources.bucket is match('^/[^\s]*[^/\s]$')
    quiet: true
  run_once: true
  delegate_to: localhost
  become: false
  no_log: true
  diff: false

- name: Read the operator's user ID
  ansible.builtin.command:
    argv: [id, -u]
  register: etcd_s3_operator_uid
  changed_when: false
  run_once: true
  delegate_to: localhost
  become: false
  no_log: true
  diff: false

- name: Inspect the key file, its directory and the bucket file
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - "{{ etcd_s3_sources.key }}"
    - "{{ etcd_s3_sources.key | dirname }}"
    - "{{ etcd_s3_sources.bucket }}"
  register: etcd_s3_source_stats
  run_once: true
  delegate_to: localhost
  become: false
  no_log: true
  diff: false

- name: Read the file system type of the key file
  ansible.builtin.command:
    argv: [stat, -f, -c, '%T', --, "{{ etcd_s3_sources.key }}"]
  register: etcd_s3_key_fstype
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: localhost
  become: false
  no_log: true
  diff: false

# The key file: a regular 0600 file (not a link) owned by the operator, of a
# plausible size, in a 0700 directory owned by the operator, on tmpfs. The
# bucket file: a regular 0600 file owned by the operator.
- name: Require a private key file on tmpfs and a private bucket file
  vars:
    es_uid: "{{ etcd_s3_operator_uid.stdout | int }}"
    es_key: "{{ etcd_s3_source_stats.results[0].stat }}"
    es_dir: "{{ etcd_s3_source_stats.results[1].stat }}"
    es_bucket: "{{ etcd_s3_source_stats.results[2].stat }}"
  ansible.builtin.assert:
    that:
      - es_key.exists | default(false) and es_key.isreg and not es_key.islnk
      - es_key.mode == '0600' and es_key.uid | int == es_uid | int
      - es_key.size > 0 and es_key.size <= etcd_s3_key_file_max_bytes
      - es_dir.exists | default(false) and es_dir.isdir and not es_dir.islnk
      - es_dir.mode == '0700' and es_dir.uid | int == es_uid | int
      - etcd_s3_key_fstype.rc == 0 and etcd_s3_key_fstype.stdout | trim == 'tmpfs'
      - es_bucket.exists | default(false) and es_bucket.isreg and not es_bucket.islnk
      - es_bucket.mode == '0600' and es_bucket.uid | int == es_uid | int
      - es_bucket.size > 0 and es_bucket.size <= 1024
    quiet: true
  run_once: true
  delegate_to: localhost
  become: false
  no_log: true
  diff: false

- name: Read the key file and the bucket file
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ etcd_s3_sources.key }}"
    - "{{ etcd_s3_sources.bucket }}"
  register: etcd_s3_source_content
  run_once: true
  delegate_to: localhost
  become: false
  no_log: true
  diff: false

# The key file is the AWS CLI's create-access-key output. A file that is not a
# JSON object yields empty values, which the next check refuses; a malformed
# object fails here. One template, so that the raw text is never parsed by
# Ansible before it is checked.
- name: Extract the access key and the bucket name
  ansible.builtin.set_fact:
    etcd_s3_credentials: >-
      {%- set raw = etcd_s3_source_content.results[0].content | b64decode -%}
      {%- set doc = raw | from_json if raw is match('^\s*\{[\s\S]*\}\s*$') else {} -%}
      {%- set key = doc.AccessKey if (doc is mapping and doc.AccessKey is defined and doc.AccessKey is mapping) else {} -%}
      {%- set bucket = (etcd_s3_source_content.results[1].content | b64decode).splitlines() | first | default('') -%}
      {{ {'user': key.UserName | default('') | string, 'status': key.Status | default('') | string,
          'access_key': key.AccessKeyId | default('') | string, 'secret_key': key.SecretAccessKey | default('') | string,
          'bucket': bucket | trim} }}
  run_once: true
  delegate_to: localhost
  become: false
  no_log: true
  diff: false

- name: Require an active key for the etcd identity and a well-formed bucket name
  ansible.builtin.assert:
    that:
      - etcd_s3_credentials.user == etcd_s3_identity_user
      - etcd_s3_credentials.status == 'Active'
      - etcd_s3_credentials.access_key is match(etcd_s3_access_key_pattern)
      - etcd_s3_credentials.secret_key is match(etcd_s3_secret_key_pattern)
      - etcd_s3_credentials.bucket is match(etcd_s3_bucket_pattern)
    quiet: true
  run_once: true
  delegate_to: localhost
  become: false
  no_log: true
  diff: false
