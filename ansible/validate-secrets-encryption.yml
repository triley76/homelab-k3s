---
# Read-only Stage 3 report. Nothing is installed, written, started, stopped or
# rewritten. It reports, per server: K3s service state and version, local API
# and etcd readiness, the drop-in, the parsed secrets-encrypt status (never its
# raw output or any hash), the last recorded change, and the cluster gate.
#
# Report only (default):
#   ansible-playbook validate-secrets-encryption.yml
# Fail when the gate or an expected state is not met:
#   ansible-playbook validate-secrets-encryption.yml \
#     -e secrets_encryption_enforce=true -e secrets_encryption_expect=enabled
#
# Privilege escalation is required because `k3s secrets-encrypt status` and
# `k3s kubectl` read root-only K3s credentials (by path; never into Ansible).
- name: Report the Stage 3 secrets-encryption state
  hosts: servers[0]
  become: true
  gather_facts: false

  tasks:
    - name: Gather the cluster state
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: gather.yml
        public: true

    - name: Evaluate preservation and snapshot freshness
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: checks.yml

    - name: Evaluate the expected state
      vars:
        se_encryptions: >-
          {{ groups['servers'] | map('extract', secrets_encryption_servers) | map(attribute='status')
          | map(attribute='encryption') | unique | list }}
        se_all: "{{ groups['servers'] | map('extract', secrets_encryption_servers) | list }}"
        se_round: "{{ secrets_encryption_enable_round }}"
        # The same rule as gate.yml: an active enable restart round that is not a
        # consistent, completed round blocks validation, whatever status shows.
        se_round_blocking: >-
          {{ se_round.active | bool and not (se_round.complete | bool and se_round.ledger_ok | bool
          and se_round.checkpoint_ok | bool and se_round.out_of_order == '') }}
      ansible.builtin.set_fact:
        secrets_encryption_expectation:
          expected: "{{ secrets_encryption_expect | default('', true) or 'none' }}"
          enable_round_blocking: "{{ se_round_blocking | bool }}"
          met: >-
            {{ not se_round_blocking | bool and ((secrets_encryption_expect | default('', true)) == ''
            or (secrets_encryption_expect == 'not-configured' and se_encryptions == ['disabled-no-config']
                and se_all | selectattr('dropin_present') | list | length == 0)
            or (secrets_encryption_expect == 'configured-disabled' and se_encryptions == ['disabled'])
            or (secrets_encryption_expect == 'enabled' and se_encryptions == ['enabled']
                and se_all | map(attribute='status') | map(attribute='stage') | unique | list == ['reencrypt_finished']
                and se_all | map(attribute='status') | selectattr('hashes_match', 'equalto', false) | list | length == 0
                and se_all | map(attribute='status') | map(attribute='active_key_type') | unique | list == [secrets_encryption_expected_key_type]
                and se_all | selectattr('dropin_present', 'equalto', false) | list | length == 0
                and se_all | selectattr('restarted_since_change', 'equalto', false) | list | length == 0)) }}
          preservation_problems: "{{ secrets_encryption_preservation_problems.split(';;') | reject('equalto', '') | list }}"
          newest_stage3_snapshot_age_seconds: "{{ secrets_encryption_snapshot_gate.age_seconds }}"

    - name: Show the expectation result
      ansible.builtin.debug:
        var: secrets_encryption_expectation

    - name: Enforce the gate and the expected state
      ansible.builtin.assert:
        that:
          - secrets_encryption_expect | default('', true) in ['', 'not-configured', 'configured-disabled', 'enabled']
          - not secrets_encryption_expectation.enable_round_blocking | bool
          - secrets_encryption_report.health_problems | length == 0
          - secrets_encryption_expectation.preservation_problems | length == 0
          - secrets_encryption_expectation.met | bool
        fail_msg: "Stage 3 validation failed; see the reports above."
        quiet: true
      when: secrets_encryption_enforce | bool
