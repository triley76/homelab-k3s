---
# Stage 3 rollback, final step: `k3s secrets-encrypt reencrypt --force --skip`
# on the first server, after disable and the restarts of every server. Rewrites
# every Secret in plaintext. See the rollback table in docs/secrets-encryption.md.
#
#   ansible-playbook secrets-encryption-reencrypt.yml --limit k3s01 \
#     -e secrets_encryption_environment=live \
#     -e secrets_encryption_confirm=reencrypt-after-disable:k3s01:$(date -u +%Y%m%dT%H%M%SZ)
#
# Refused in a live environment until the rehearsal record approves it.
- name: Rewrite every Secret after disable (rollback)
  hosts: servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0

  vars:
    secrets_encryption_phase: reencrypt-after-disable
    secrets_encryption_target: first

  pre_tasks:
    # Runs on the controller, before facts, privilege escalation or any other task.
    - name: Guard the phase
      ansible.builtin.import_role:
        name: secrets-encryption
        tasks_from: guard.yml
      become: false

    - name: Gather minimal facts after the guard
      ansible.builtin.setup:
        gather_subset:
          - min

  tasks:
    - name: Gate on health, preservation and a snapshot newer than the last change
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: gate.yml
      vars:
        secrets_encryption_snapshot_after_change: true

    - name: Re-encrypt after disable
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: reencrypt.yml
