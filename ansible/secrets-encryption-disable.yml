---
# Stage 3 rollback, step 1: `k3s secrets-encrypt disable` on the first server.
# New writes are stored in plaintext; existing Secrets stay encrypted until
# secrets-encryption-reencrypt.yml runs after every server has restarted. See
# the rollback table in docs/secrets-encryption.md.
#
#   ansible-playbook secrets-encryption-disable.yml --limit k3s01 \
#     -e secrets_encryption_environment=live \
#     -e secrets_encryption_confirm=disable:k3s01:$(date -u +%Y%m%dT%H%M%SZ)
#
# Refused in a live environment until the rehearsal record approves it.
- name: Disable secrets encryption (rollback)
  hosts: servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0

  vars:
    secrets_encryption_phase: disable
    secrets_encryption_target: first

  pre_tasks:
    # Runs on the controller, before facts, privilege escalation or any other task.
    - name: Guard the phase
      ansible.builtin.import_role:
        name: secrets-encryption
        tasks_from: guard.yml
      become: false

    - name: Gather minimal facts after the guard
      ansible.builtin.setup:
        gather_subset:
          - min

  tasks:
    - name: Gate on health, preservation and a snapshot newer than the last change
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: gate.yml
      vars:
        secrets_encryption_snapshot_after_change: true

    - name: Disable
      ansible.builtin.include_role:
        name: secrets-encryption
        tasks_from: disable.yml
